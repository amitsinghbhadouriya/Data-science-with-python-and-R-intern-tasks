[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-intern-tasks"
version = "1.0.0"
description = "Data Science with Python & R Internship Task Portfolio"
authors = [{ name = "Amit Singh Bhadouriya" }]
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --tb=short"
testpaths = [
    "data_science_capstone_whitepaper/tests",
    "analysis_preregistration_deliverable/tests",
    "tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache"
]
