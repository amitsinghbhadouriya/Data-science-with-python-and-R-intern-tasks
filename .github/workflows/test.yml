name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Preregistration Deliverable Tests
      run: |
        pytest analysis_preregistration_deliverable/tests/

    - name: Execute Capstone Deliverable Tests
      run: |
        pytest data_science_capstone_whitepaper/tests/

    - name: Execute Repository Sanity Tests
      run: |
        pytest tests/
